# ADR-0008 fast gate: required for merge, target <15 min.
# The heavy suite (MSVC ASan, 30 min clang-cl fuzz, bench vs baselines, full
# clang-tidy, esctest) is the separate nightly job and is NOT in this file —
# M0 scope is the merge gate only.
name: fast-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # docs/plan pins Qt 6.11.1, but aqtinstall 3.3.0 (what install-qt-action
  # ships) cannot resolve Qt 6.11's new per-arch repo layout, so 6.11 is not
  # installable here any more than it was on the dev machine. CI tracks the
  # version the tree is actually built against. Flip both together.
  QT_VERSION: 6.10.3

jobs:
  fast-gate:
    # The tree builds with /std:c++23preview under /W4 /WX, so a different
    # toolset version changes the warning set and can turn the gate red on a
    # runner-image bump alone. This label was OBSERVED to resolve cl to MSVC
    # 14.51.36231 — the same toolset as the dev machine (see the Toolchain
    # sanity step, which prints it every run). ADR-0008 assumed plain
    # windows-latest already carried VS2026; that claim is contested and the
    # explicit label does not depend on it either way.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # clang-tidy needs a merge base to diff against

      # Ninja cannot find cl without this, and clang-tidy resolves no MSVC
      # headers when INCLUDE is unset — its findings become parse garbage.
      - name: MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools # qt_add_shaders / qsb
          cache: true

      - name: Bridge env into the preset contract
        shell: pwsh
        run: |
          # CMakePresets reads $env{QT_ROOT} and $env{VCPKG_ROOT}. The Qt
          # action exports QT_ROOT_DIR (not QT_ROOT); the image exports
          # VCPKG_INSTALLATION_ROOT (not VCPKG_ROOT). Bridge both.
          "QT_ROOT=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Check out vcpkg at the manifest baseline
        shell: pwsh
        run: |
          # The image's vcpkg sits at whatever commit the image was built
          # with. Handing it only our baseline.json is not enough: it reads
          # the version DATABASE (versions/) off disk, so a 2026 baseline
          # against a 2024 versions/ tree fails with "no version database
          # entry for <port> at <date>". Move the whole registry — ports,
          # versions and baseline — onto the pinned commit, which is what
          # builtin-baseline actually means. vcpkg.json stays the only
          # place the SHA is written down.
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          Write-Host "vcpkg baseline: $baseline"
          git -C $env:VCPKG_ROOT fetch --no-tags origin $baseline
          git -C $env:VCPKG_ROOT checkout --force --detach $baseline
          git -C $env:VCPKG_ROOT rev-parse HEAD
          # Re-bootstrap so vcpkg-tool matches the registry commit.
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Toolchain sanity
        shell: pwsh
        run: |
          # Ninja is not reliably on PATH on this image even inside the VS dev
          # environment, and a missing one surfaces as the misleading
          # "unable to find a build program corresponding to Ninja".
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install ninja failed" }
            # GITHUB_PATH, not GITHUB_ENV: writing PATH into GITHUB_ENV freezes
            # it for every later step instead of extending it.
            "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
            $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
          }
          cmake --version
          Write-Host "ninja: $((Get-Command ninja).Source) $(ninja --version)"
          Write-Host "cl:    $((Get-Command cl).Source)"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          # vcpkg's own GitHub-Actions-cache backend (x-gha) was removed
          # upstream in 2025 — actions/cache over the default archive dir is
          # the remaining endorsed path. Baseline is pinned inside vcpkg.json,
          # so hashing that file is a sufficient key.
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test (unit + corpus)
        run: ctest --preset dev

      - name: krait-core standalone (zero-dep proof)
        shell: pwsh
        env:
          # Blanked deliberately. The Qt action exports these globally, so
          # without clearing them a future find_package(Qt6) in src/core would
          # RESOLVE here and this sacred-rule-1 guard would pass green — the
          # exact thing it exists to catch.
          QT_ROOT: ''
          QT_ROOT_DIR: ''
          Qt5_DIR: ''
          Qt6_DIR: ''
          CMAKE_PREFIX_PATH: ''
        run: |
          # No vcpkg toolchain, no Qt on the path: proves src/core stayed pure.
          # Breaking this build is breaking the build (rules/vt-core.md).
          #
          # utf8proc is the ONE permitted external (ADR-0003), so from T19 it
          # has to be findable here. Handed over as utf8proc_DIR and NOT as a
          # prefix path over vcpkg_installed on purpose: the whole tree also
          # holds fmt, freetype and Catch2, and making those resolvable would
          # let a find_package(fmt) in src/core sail through the guard that
          # exists to catch exactly that.
          $u8 = "$env:GITHUB_WORKSPACE/build/dev/vcpkg_installed/x64-windows/share/utf8proc"
          if (-not (Test-Path "$u8/utf8proc-config.cmake")) {
            throw "utf8proc config not at $u8 — did the dev configure run first?"
          }
          cmake -S tests/core-standalone -B build/core-standalone -G Ninja `
                -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=cl `
                "-Dutf8proc_DIR=$u8"
          if ($LASTEXITCODE -ne 0) { throw "standalone configure failed" }
          cmake --build build/core-standalone
          if ($LASTEXITCODE -ne 0) { throw "standalone build failed" }

      - name: Fuzz smoke (60 s, zero crashes)
        shell: cmd
        run: tests\fuzz\run-smoke.cmd

      - name: clang-format check
        shell: pwsh
        run: |
          # third_party is vendored verbatim and is never reformatted.
          $files = git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' 'bench/*.cpp' 'bench/*.h'
          # pwsh does not throw on a native non-zero exit mid-script, so an
          # empty list must be distinguished from a FAILED enumeration —
          # otherwise a broken git turns this gate into a green no-op.
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed to enumerate sources" }
          if (-not $files) { throw "no sources matched — the check would be vacuous" }
          clang-format --version
          clang-format --dry-run -Werror $files

      - name: clang-tidy (changed files)
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only .cpp files appear in compile_commands.json; headers are
          # covered through HeaderFilterRegex when their TU is tidied.
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') { $base = '' }
          $changed = if ($base) {
            git diff --name-only --diff-filter=ACMR $base HEAD -- 'src/*.cpp' 'tests/*.cpp'
          } else {
            git ls-files 'src/*.cpp' 'tests/*.cpp'
          }
          # Same trap as the format step: a dangling base SHA after a
          # force-push would make git fail, print "nothing changed", and go
          # green having tidied nothing.
          if ($LASTEXITCODE -ne 0) { throw "git failed to enumerate changed files" }
          if (-not $changed) { Write-Host 'no C++ sources changed'; exit 0 }
          # A file with no entry in compile_commands.json gets clang-tidy's
          # DEFAULT flags — C++17, no /std:c++23preview — so every std::span in
          # it becomes a fatal clang-diagnostic-error that has nothing to do
          # with the code. tests/fuzz/*.cpp is the real case: it is built only
          # by the fuzz presets, never by dev. Skip those here (the fuzz presets
          # compile them with /W4 /WX, so they are not unchecked) and SAY so —
          # a silent skip is how the fuzz TU went untidied unnoticed.
          $db = Get-Content build/dev/compile_commands.json -Raw | ConvertFrom-Json
          if (-not $db) { throw "could not read build/dev/compile_commands.json" }
          $known = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          foreach ($e in $db) { [void]$known.Add(((Resolve-Path -LiteralPath $e.file).Path)) }
          $tidy = @(); $skipped = @()
          foreach ($f in $changed) {
            $full = (Resolve-Path -LiteralPath $f).Path
            if ($known.Contains($full)) { $tidy += $f } else { $skipped += $f }
          }
          if ($skipped) { Write-Host "NOT in compile_commands.json, skipped: $($skipped -join ', ')" }
          if (-not $tidy) { Write-Host 'no changed source has a compile command'; exit 0 }
          $changed = $tidy
          Write-Host "tidying: $($changed -join ', ')"
          # /Zc:preprocessor and friends are cl-only spellings that clang-tidy's
          # driver reports as unused/unknown; they are not findings.
          clang-tidy -p build/dev `
            --extra-arg=-Wno-unknown-argument `
            --extra-arg=-Wno-unused-command-line-argument `
            $changed
          # Gating is .clang-tidy's WarningsAsErrors ('bugprone-*,concurrency-*');
          # the rest are advisory here and gate in the nightly full run.
