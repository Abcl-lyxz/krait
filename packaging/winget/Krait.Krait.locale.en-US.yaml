ShortDescription: A GPU-accelerated SSH client and terminal for Windows.
Description: >-
  Krait is a terminal and connection manager for Windows: SSH, local shells over
  ConPTY, telnet, raw sockets and serial. It renders with a custom GPU glyph
  atlas, treats Thai, CJK and emoji as first-class text rather than an
  afterthought, and manages saved sessions as a real part of the product.
  Secrets are held only in the Windows DPAPI vault.
